# This is a Declarative Automation Bundle definition for jobs_pipeline_dku_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: jobs_pipeline_dku_bundle
  uuid: b6b9a2e0-4a67-4f8c-84ef-accd05d3bdc1

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  deploy_sp:
    description: Application ID of the deploying service principal
  # dev_group:
  #   default: <azaiml-developers-group>

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    permissions:
      - level: CAN_MANAGE
        service_principal_name: ${var.deploy_sp}
      # - level: CAN_MANAGE
      #   group_name: ${var.dev_group}
      - level: CAN_MANAGE
        user_name: rishabh.singh15.ext@proximus.com
    variables:
      catalog: pxs_azaiml_dbr_dft_d_gwc_dbws_0_7405612340831593
      schema: information_schema
